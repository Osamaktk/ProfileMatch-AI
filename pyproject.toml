[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "profilematch-ai"
version = "0.3.0"
description = "Two-phase LinkedIn discovery and evidence-backed contact classification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "openai>=2.0,<3",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
profilematch-enrich = "securedesk.enrichment.cli:main"

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.0,<10", "pytest-cov>=5.0,<8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["securedesk*", "contact_enrichment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
